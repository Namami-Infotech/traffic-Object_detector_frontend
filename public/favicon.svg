<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Lens Outer Ring -->
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Lens Iris / Core Glowing Gradient -->
    <radialGradient id="lensCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="80%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>

    <!-- AI Scan Glow Filter -->
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Camera -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- AI Target Reticle Brackets (Corners) -->
  <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#aiGlow)">
    <path d="M18 34 V22 H30" />
    <path d="M110 34 V22 H98" />
    <path d="M18 94 V106 H30" />
    <path d="M110 94 V106 H98" />
  </g>

  <!-- AI Horizon / Grid Traffic Lines (subtle) -->
  <g stroke="#60a5fa" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="20" y1="64" x2="108" y2="64" stroke-dasharray="3 3" />
    <line x1="64" y1="20" x2="64" y2="108" stroke-dasharray="3 3" />
  </g>

  <!-- Camera Group with Shadow -->
  <g filter="url(#cardShadow)">
    <!-- Camera Body Top Notch -->
    <path d="M48 37 C48 34.5 50 32.5 52.5 32.5 H75.5 C78 32.5 80 34.5 80 37 L82 41 H46 Z" fill="#f1f5f9" />
    
    <!-- Camera Main Body -->
    <rect x="25" y="41" width="78" height="54" rx="14" fill="#ffffff" />
    
    <!-- Camera Flash / Sensor Dot -->
    <circle cx="87" cy="51" r="3.5" fill="#ef4444" filter="url(#aiGlow)" />
    <circle cx="87" cy="51" r="1.5" fill="#fecaca" />

    <!-- Lens Rim / Bezel -->
    <circle cx="64" cy="68" r="23" fill="url(#lensOuter)" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Lens Optical Aperture Accent Ring -->
    <circle cx="64" cy="68" r="18" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="8 4" />

    <!-- Lens Glass Glowing Core -->
    <circle cx="64" cy="68" r="14" fill="url(#lensCore)" />

    <!-- Inner Pupil / Sensor -->
    <circle cx="64" cy="68" r="7" fill="#082f49" />

    <!-- Lens Glint / Specular Light Reflection -->
    <ellipse cx="59" cy="63" rx="3.5" ry="2" fill="#ffffff" opacity="0.9" transform="rotate(-35 59 63)" />
    <circle cx="68" cy="72" r="1.2" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Small AI Active Indicator Badge at bottom right -->
  <g filter="url(#aiGlow)">
    <circle cx="95" cy="89" r="4.5" fill="#10b981" />
    <circle cx="95" cy="89" r="2" fill="#ffffff" />
  </g>
</svg>